<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slægtsforskning Peter Østergård</title>
    <style>
        /* --- TEMA VARIABLER --- */
        :root {
            --bg-color: #f0f4f8; --text-color: #334155; --text-muted: #64748b;
            --card-bg: #ffffff; --card-border: #e2e8f0; --line-color: #cbd5e1;
            --ui-bg: rgba(255, 255, 255, 0.95); --btn-bg: #f1f5f9; --btn-hover: #e2e8f0;
            --modal-overlay: rgba(15, 23, 42, 0.5); --modal-bg: #ffffff;
            --input-bg: #ffffff; --input-border: #cbd5e1; --avatar-bg: #f1f5f9;
            --id-badge-bg: #f8fafc; --accent-gold: #d4af37; --focus-outline: rgba(74,144,226,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a; --text-color: #f8fafc; --text-muted: #94a3b8;
            --card-bg: #1e293b; --card-border: #475569; --line-color: #475569;
            --ui-bg: rgba(30, 41, 59, 0.95); --btn-bg: #334155; --btn-hover: #475569;
            --modal-overlay: rgba(0, 0, 0, 0.85); --modal-bg: #0f172a;
            --input-bg: #1e293b; --input-border: #475569; --avatar-bg: #334155;
            --id-badge-bg: #334155; --focus-outline: rgba(212,175,55,0.2);
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; overflow: hidden; height: 100vh; width: 100vw; transition: background-color 0.3s, color 0.3s; }
        
        /* Top Overskrift */
        #tree-title-container { position: absolute; top: 25px; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
        #tree-title { margin: 0; font-size: 22px; font-weight: bold; color: var(--text-color); text-shadow: 0 0 10px var(--bg-color), 0 0 20px var(--bg-color); transition: color 0.3s; }

        #viewport { width: 100%; height: 100%; position: relative; cursor: grab; touch-action: none; }
        #viewport:active { cursor: grabbing; }
        
        #ui-controls { position: fixed; bottom: 20px; right: 20px; z-index: 100; background: var(--ui-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--line-color); box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;}
        #ui-controls button, #ui-controls select { background: var(--btn-bg); color: var(--text-color); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; transition: all 0.2s; outline: none;}
        #ui-controls button:hover, #ui-controls select:hover { background: var(--btn-hover); }
        #ui-controls .csv-btn { background: #10b981; color: white; border-color: #059669; margin-right: 5px;}
        #ui-controls .csv-btn:hover { background: #059669; }
        #proband-label { font-size: 12px; color: var(--text-color); border-right: 1px solid var(--line-color); padding-right: 10px; margin-right: 5px;}
        
        /* Den nye gruppe til zoom knapperne */
        .zoom-group { display: flex; gap: 8px; }

        #loading { font-size: 16px; font-weight: bold; color: var(--text-muted); position: absolute; top: 20px; left: 20px; z-index: 100; }

        /* --- TRÆ LAYOUT (FLEXBOX CENTRERING) --- */
        #tree-container { display: flex; flex-direction: column-reverse; align-items: center; position: absolute; bottom: 100px; left: 50%; transform-origin: 50% 100%; }
        .node-wrapper { display: flex; flex-direction: column-reverse; align-items: center; position: relative; }
        
        .parents-container { display: flex; flex-direction: row; justify-content: center; margin-bottom: 30px; position: relative; width: 100%; }
        .parent-branch { display: flex; justify-content: center; flex: 1; position: relative; padding: 0 5px; }
        
        .parent-branch::before { content: ''; position: absolute; bottom: -15px; left: 50%; width: 0; height: 15px; border-left: 2px solid var(--line-color); }
        .parent-branch.left-branch::after { content: ''; position: absolute; bottom: -15px; left: 50%; right: 0; border-bottom: 2px solid var(--line-color); }
        .parent-branch.right-branch::after { content: ''; position: absolute; bottom: -15px; left: 0; right: 50%; border-bottom: 2px solid var(--line-color); }
        .parents-container::after { content: ''; position: absolute; bottom: -30px; left: 50%; width: 0; height: 15px; border-left: 2px solid var(--line-color); }

        /* --- PERSON KORT --- */
        .person-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 10px; width: 160px; min-height: 65px; margin: 0; cursor: pointer; position: relative; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.04); transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
        .person-card:hover { border-color: var(--accent-gold); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); }
        .person-card.male { border-bottom: 3px solid #4A90E2; }
        .person-card.female { border-bottom: 3px solid #E94E77; }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--avatar-bg); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--card-border); color: var(--text-muted); font-size: 18px; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { display: flex; flex-direction: column; width: 100%; }
        .name { font-weight: bold; font-size: 12px; color: var(--text-color); margin: 0; line-height: 1.2; white-space: normal; word-wrap: break-word; }
        .dates { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
        
        .id-badge { position: absolute; top: -8px; right: -8px; background: var(--id-badge-bg); color: var(--text-color); border-radius: 50%; width: 22px; height: 22px; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid var(--line-color); }
        .focus-btn { position: absolute; bottom: 6px; right: 6px; background: var(--btn-bg); color: var(--text-color); border: 1px solid var(--line-color); border-radius: 4px; padding: 4px 6px; font-size: 9px; font-weight: bold; cursor: pointer; opacity: 0; transition: opacity 0.2s, background 0.2s; z-index: 10; }
        .person-card:hover .focus-btn { opacity: 1; }
        .focus-btn:hover { background: var(--btn-hover); }

        .add-parent-btn { background: transparent; border: 1px dashed var(--line-color); color: var(--text-muted); border-radius: 6px; padding: 10px; width: 160px; margin: 0; cursor: pointer; text-align: center; font-size: 10px; transition: all 0.2s; }
        .add-parent-btn:hover { background: var(--id-badge-bg); color: var(--text-color); border-color: var(--text-muted); }
        
        /* --- MODAL DESIGN --- */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); backdrop-filter: blur(2px); z-index: 1000; align-items: center; justify-content: center; transition: background 0.3s; padding: 10px; box-sizing: border-box; }
        #modal-content { background: var(--modal-bg); padding: 30px; border-radius: 8px; width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--card-border); position: relative; color: var(--text-color); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); box-sizing: border-box; }
        #close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        #close-modal:hover { color: var(--text-color); }
        
        #view-mode { display: flex; flex-direction: column; }
        .view-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--line-color); }
        .view-header .avatar-circle { width: 70px; height: 70px; font-size: 30px; }
        .view-name { font-size: 24px; font-weight: bold; color: var(--text-color); margin: 0; }
        .view-dates { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        
        .data-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px; }
        .data-row { display: flex; padding: 10px 15px; background: var(--bg-color); border-radius: 6px; border: 1px solid var(--line-color); align-items: center;}
        .data-label { font-weight: bold; font-size: 11px; width: 35%; color: var(--text-muted); text-transform: uppercase; }
        .data-value { font-size: 13px; width: 65%; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; word-break: break-word;}
        .data-value a { color: #3b82f6; text-decoration: none; font-size: 11px; font-weight: bold; background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 4px; white-space: nowrap; margin-left: 10px;}
        
        #edit-mode { display: none; }
        .form-section { background: var(--btn-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .form-section h3 { margin-top: 0; margin-bottom: 12px; font-size: 12px; color: var(--text-color); text-transform: uppercase; border-bottom: 1px solid var(--card-border); padding-bottom: 4px; }
        .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .section-grid.full { grid-template-columns: 1fr; }
        
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .input-row { display: flex; gap: 5px; }
        .input-row input[type="text"], .input-row input[type="url"] { padding: 8px; border-radius: 4px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); font-family: inherit; font-size: 12px; width: 100%; box-sizing: border-box;}
        .input-row input[type="text"]:focus, .input-row input[type="url"]:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 0 2px var(--focus-outline); }
        .input-row input[type="text"] { flex: 2; }
        .input-row input[type="url"] { flex: 1; color: #4A90E2; }
        .input-row input.no-link { flex: 1 !important; }

        .modal-actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); position: sticky; bottom: -30px; background: var(--modal-bg); padding-bottom: 20px; z-index: 10;}
        .btn-primary { background: #3b82f6; color: #ffffff; border: none; padding: 12px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 2; transition: background 0.2s;}
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: transparent; color: var(--text-color); border: 1px solid var(--line-color); padding: 12px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; transition: background 0.2s;}
        .btn-secondary:hover { background: var(--btn-hover); }
        .btn-gold { background: #d4af37; color: #000; border: none; padding: 12px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s;}
        .btn-gold:hover { background: #b8972e; }

        /* --- MOBIL & TABLET OPTIMERING --- */
        @media (max-width: 768px) {
            #tree-title { font-size: 18px; }
            #ui-controls { bottom: 10px; left: 10px; right: 10px; justify-content: center; padding: 8px; }
            #ui-controls button, #ui-controls select { padding: 6px 10px; font-size: 11px; flex-grow: 1; text-align: center;}
            .zoom-group { flex-grow: 1; }
            .zoom-group button { width: 50%; }
            #proband-label { width: 100%; border-right: none; text-align: center; margin-bottom: 5px; padding-right: 0; }
            .section-grid { grid-template-columns: 1fr !important; } 
            #modal-content { padding: 20px 15px; }
            .modal-actions { flex-direction: column; } 
            .data-row { flex-direction: column; align-items: flex-start; gap: 4px; }
            .data-label { width: 100%; }
            .data-value { width: 100%; justify-content: flex-start; gap: 10px; flex-wrap: wrap;}
            .data-value a { margin-left: 0; }
            .person-card { width: 140px; padding: 8px; } 
            .focus-btn { opacity: 1; } 
        }
    </style>
</head>
<body>

    <div id="loading">Henter data...</div>

    <div id="tree-title-container">
        <h1 id="tree-title">Stamtræ for <span id="title-name">Fælles Børn</span></h1>
    </div>

    <div id="ui-controls">
        <div id="proband-label">Udgangspunkt: <strong>Fælles Børn (Nr. 1)</strong></div>
        
        <select id="gen-select" title="Vælg antal generationer at vise">
            <option value="3">3 Gen.</option>
            <option value="4">4 Gen.</option>
            <option value="5">5 Gen.</option>
            <option value="6" selected>6 Gen.</option>
            <option value="7">7 Gen.</option>
            <option value="8">8 Gen.</option>
            <option value="9">9 Gen.</option>
            <option value="10">10 Gen.</option>
            <option value="15">15 Gen.</option>
        </select>

        <button id="btn-csv" class="csv-btn" title="Eksporter dette specifikke træ til CSV" onclick="genererCSV()">💾 CSV</button>
        <button id="theme-toggle" title="Skift Mellem Nat og Dag">🌙 Nat</button>
        
        <button id="btn-reset-proband" title="Fokusér visning på dit valgte Udgangspunkt">🎯 Nulstil til udgangspunkt</button>
        <button id="btn-home" title="Gå helt tilbage til Nr. 1 i dit ark">🏠 Fælles Børn (Nr. 1)</button>
        
        <div class="zoom-group">
            <button id="zoom-in">🔍 +</button>
            <button id="zoom-out">🔍 -</button>
        </div>
    </div>

    <div id="viewport">
        <div id="tree-container" style="display: none;"></div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <button id="close-modal">&times;</button>
            <p style="margin: 0; font-size: 11px; color: var(--text-muted); position: absolute; top: 15px; left: 30px;">Ahnentafel Nr: <span id="display-vid" style="color: var(--text-color); font-weight: bold; font-size: 14px;"></span> <span id="display-tid"></span></p>

            <div id="view-mode">
                <div class="view-header">
                    <div id="view-avatar" class="avatar-circle"></div>
                    <div>
                        <h2 id="view-name" class="view-name"></h2>
                        <div id="view-dates" class="view-dates"></div>
                    </div>
                </div>
                <div id="view-data-list" class="data-list"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-gold" id="set-proband-btn" onclick="setSomProband()">🌟 Gør til Nr. 1 (Udgangspunkt)</button>
                    <button type="button" class="btn-primary" onclick="skiftTilEdit()">✏️ Rediger Oplysninger</button>
                </div>
            </div>

            <div id="edit-mode">
                <h2 style="margin-top: 15px; margin-bottom: 20px; color: var(--text-color);">Rediger Profil</h2>
                <form id="person-form">
                    <div class="form-section"><h3>Identitet & Profilbillede</h3><div class="section-grid"><div class="input-group"><label>Fulde Navn</label><div class="input-row"><input type="text" id="val-navn" class="no-link"></div></div><div class="input-group"><label>Profilbillede URL</label><div class="input-row"><input type="url" id="val-billede" style="flex:1;"></div></div></div></div>
                    <div class="form-section"><h3>Fødsel & Dåb</h3><div class="section-grid"><div class="input-group"><label>Fødselsdato</label><div class="input-row"><input type="text" id="val-foedt" class="no-link"></div></div><div class="input-group"><label>Fødested</label><div class="input-row"><input type="text" id="val-sted" class="no-link"></div></div><div class="input-group" style="grid-column: span 2;"><label>Dåb (Dato, Kirke og Kirkebogslink)</label><div class="input-row"><input type="text" id="val-doebt"><input type="url" id="link-doebt" placeholder="🔗 Link"></div></div></div></div>
                    <div class="form-section"><h3>Konfirmation</h3><div class="section-grid full"><div class="input-group"><label>Konfirmation</label><div class="input-row"><input type="text" id="val-konf"><input type="url" id="link-konf" placeholder="🔗 Link"></div></div></div></div>
                    <div class="form-section"><h3>Død & Begravelse</h3><div class="section-grid"><div class="input-group"><label>Dødsdato</label><div class="input-row"><input type="text" id="val-doed" class="no-link"></div></div><div class="input-group"><label>Dato Begravelse</label><div class="input-row"><input type="text" id="val-begr_dato" class="no-link"></div></div><div class="input-group" style="grid-column: span 2;"><label>Begravet (Sted og Kirkebogslink)</label><div class="input-row"><input type="text" id="val-begr_sted"><input type="url" id="link-begr_sted" placeholder="🔗 Link"></div></div></div></div>
                    <div class="form-section"><h3>Familie (Vielser)</h3><div class="section-grid full"><div class="input-group"><label>Vielse 1</label><div class="input-row"><input type="text" id="val-gift1"><input type="url" id="link-gift1" placeholder="🔗 Link"></div></div><div class="input-group" style="margin-top:5px;"><label>Vielse 2</label><div class="input-row"><input type="text" id="val-gift2"><input type="url" id="link-gift2" placeholder="🔗 Link"></div></div><div class="input-group" style="margin-top:5px;"><label>Vielse 3</label><div class="input-row"><input type="text" id="val-gift3"><input type="url" id="link-gift3" placeholder="🔗 Link"></div></div></div></div>
                    <div class="form-section"><h3>Militærtjeneste</h3><div class="section-grid"><div class="input-group"><label>Lægdsrulle</label><div class="input-row"><input type="text" id="val-laegd"><input type="url" id="link-laegd" placeholder="🔗 Link"></div></div><div class="input-group"><label>Soldat</label><div class="input-row"><input type="text" id="val-soldat"><input type="url" id="link-soldat" placeholder="🔗 Link"></div></div></div></div>
                    <div class="form-section"><h3>Erhverv, Kald & Ejendom</h3><div class="section-grid"><div class="input-group"><label>Erhverv</label><div class="input-row"><input type="text" id="val-erhverv"><input type="url" id="link-erhverv" placeholder="🔗 Link"></div></div><div class="input-group"><label>Borgerskab</label><div class="input-row"><input type="text" id="val-borger"><input type="url" id="link-borger" placeholder="🔗 Link"></div></div><div class="input-group"><label>Udnævn / Kald</label><div class="input-row"><input type="text" id="val-kald"><input type="url" id="link-kald" placeholder="🔗 Link"></div></div><div class="input-group"><label>Skøde / Fæste</label><div class="input-row"><input type="text" id="val-skoede"><input type="url" id="link-skoede" placeholder="🔗 Link"></div></div><div class="input-group"><label>Brandsforsikring</label><div class="input-row"><input type="text" id="val-brand"><input type="url" id="link-brand" placeholder="🔗 Link"></div></div><div class="input-group"><label>Aftægt</label><div class="input-row"><input type="text" id="val-aftaegt"><input type="url" id="link-aftaegt" placeholder="🔗 Link"></div></div></div></div>
                    <div class="form-section"><h3>Folketællinger</h3><div class="section-grid" id="census-grid"></div></div>
                    <div class="form-section"><h3>Bemærkninger</h3><div class="section-grid full"><div class="input-group"><div class="input-row"><input type="text" id="val-bemaerk" placeholder="Generelle noter..."><input type="url" id="link-bemaerk" placeholder="🔗 Link"></div></div></div></div>
                </form>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="skiftTilView()">Annuller</button>
                    <button type="button" id="save-btn" class="btn-primary">💾 Gem ændringer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SÆT DIN WEB APP URL HERUNDER:
        const API_URL = "https://script.google.com/macros/s/AKfycbywgVzZU2eg6lxAP7-EIDQPGBbJp-Jl9CdpFMpVMuf7fRApj9r1WI55YnTbPkbn6e0yig/exec";
        
        let MAX_GEN = parseInt(document.getElementById('gen-select').value); 
        let stamtraeData = {}; 
        let headersRow = []; 
        let sessionProbandTrueId = 1; 
        let currentViewRootTrueId = 1; 

        document.getElementById('gen-select').addEventListener('change', (e) => {
            MAX_GEN = parseInt(e.target.value);
            TegnTrae();
        });

        function getDisplayId(trueId, probandTrueId) {
            let t_bin = trueId.toString(2);
            let p_bin = probandTrueId.toString(2);
            if (t_bin.startsWith(p_bin)) { return parseInt("1" + t_bin.substring(p_bin.length), 2); }
            return null;
        }

        function getTrueId(displayId, probandTrueId) {
            let d_bin = displayId.toString(2);
            let p_bin = probandTrueId.toString(2);
            return parseInt(p_bin + d_bin.substring(1), 2);
        }

        function opdaterProbandLabel() {
            let navn = "Fælles Børn";
            if (stamtraeData[sessionProbandTrueId] && stamtraeData[sessionProbandTrueId].navn.text) {
                navn = stamtraeData[sessionProbandTrueId].navn.text;
            }
            document.getElementById('proband-label').innerHTML = `Udgangspunkt: <strong style="color:var(--accent-gold);">${navn}</strong>`;
            document.getElementById('title-name').innerText = navn;
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        let currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        opdaterTemaKnap();

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            opdaterTemaKnap();
        });

        function opdaterTemaKnap() { themeToggleBtn.innerText = currentTheme === 'light' ? '🌙 Nat' : '☀️ Dag'; }

        const formFields = [
            { id: 'navn', label: 'Navn', col: 1, textOnly: true }, { id: 'foedt', label: 'Født', col: 2, textOnly: true }, { id: 'sted', label: 'Fødested', col: 3, textOnly: true },
            { id: 'doebt', label: 'Døbt', col: 4 }, { id: 'konf', label: 'Konfirmeret', col: 5 }, { id: 'doed', label: 'Død', col: 6, textOnly: true },
            { id: 'begr_sted', label: 'Begravet', col: 7 }, { id: 'begr_dato', label: 'Dato Begravelse', col: 8, textOnly: true }, { id: 'laegd', label: 'Lægdsrulle', col: 9 },
            { id: 'soldat', label: 'Soldat', col: 10 }, { id: 'gift1', label: 'Vielse 1', col: 11 }, { id: 'gift2', label: 'Vielse 2', col: 12 },
            { id: 'gift3', label: 'Vielse 3', col: 13 }, { id: 'skoede', label: 'Skøde/Fæste', col: 14 }, { id: 'erhverv', label: 'Erhverv', col: 15 },
            { id: 'brand', label: 'Brandforsikring', col: 16 }, { id: 'borger', label: 'Borgerskab', col: 17 }, { id: 'kald', label: 'Udnævn/Kald', col: 18 },
            { id: 'aftaegt', label: 'Aftægt', col: 19 }, { id: 'bemaerk', label: 'Bemærkninger', col: 20 }, { id: 'billede', label: 'Profilbillede', col: 21, textOnly: true }
        ];

        const censusYears = ['1940', '1930', '1925', '1921', '1916', '1911', '1906', '1901', '1895', '1890', '1880', '1870', '1860', '1855', '1850', '1845', '1840', '1835', '1834', '1801', '1787'];

        function initCensusDOM() {
            const container = document.getElementById('census-grid');
            censusYears.forEach(aar => {
                const group = document.createElement('div');
                group.className = 'input-group';
                group.innerHTML = `<label>År ${aar}</label><div class="input-row"><input type="text" id="ft-val-${aar}"><input type="url" id="ft-link-${aar}" placeholder="🔗 Link"></div>`;
                container.appendChild(group);
            });
        }
        initCensusDOM();

        function ParseData(rawStr) {
            if(!rawStr) return { text: "", link: "" };
            const parts = rawStr.split('||');
            return { text: parts[0] || "", link: parts[1] || "" };
        }

        async function hentData() {
            try {
                const response = await fetch(API_URL);
                const json = await response.json();
                
                headersRow = json.headers;
                stamtraeData = {}; 
                
                json.personer.forEach(p => {
                    let id = parseInt(p.row[0]);
                    if (!isNaN(id)) {
                        let personObj = { id: id, rawRow: p.row, ft: {} };
                        formFields.forEach(f => { personObj[f.id] = ParseData(p.row[f.col]); });
                        censusYears.forEach(aar => { personObj.ft[aar] = ParseData(p.ft[aar]); });
                        stamtraeData[id] = personObj;
                    }
                });
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tree-container').style.display = 'flex';
                TegnTrae();
            } catch (error) {
                document.getElementById('loading').innerText = "Fejl: Forbindelse til databasen fejlede.";
            }
        }

        function TegnTrae() {
            opdaterProbandLabel();
            const container = document.getElementById('tree-container');
            container.innerHTML = '';
            container.appendChild(SkabGren(currentViewRootTrueId, 1));
            translateX = 0; translateY = -100; scale = 1; updateTransform();
        }

        function setSomProband() {
            sessionProbandTrueId = currentEditingTrueId;
            currentViewRootTrueId = currentEditingTrueId; 
            modal.style.display = 'none';
            TegnTrae();
        }

        function fokusIbund(event, trueId) {
            event.stopPropagation(); 
            currentViewRootTrueId = trueId; 
            TegnTrae();
        }

        function SkabGren(trueId, currentGen) {
            const wrapper = document.createElement('div');
            wrapper.className = 'node-wrapper';
            
            const person = stamtraeData[trueId];
            const displayId = getDisplayId(trueId, sessionProbandTrueId);
            
            const harNavn = person && person.navn && person.navn.text && person.navn.text.trim() !== "";
            
            if (harNavn) {
                const card = document.createElement('div');
                card.className = `person-card ${(displayId === 1 || displayId % 2 === 0) ? 'male' : 'female'}`;
                
                let avatarHTML = person.billede.text ? `<div class="avatar-circle"><img src="${person.billede.text}"></div>` : `<div class="avatar-circle">👤</div>`;
                
                let dateString = "";
                if (person.foedt.text || person.doed.text) {
                    let fAar = person.foedt.text.includes('/') ? person.foedt.text.split('/')[2] : person.foedt.text;
                    let dAar = person.doed.text.includes('/') ? person.doed.text.split('/')[2] : person.doed.text;
                    dateString = `${fAar || '?'} - ${dAar || '?'}`;
                }

                let focusBtnHTML = `<button class="focus-btn" onclick="fokusIbund(event, ${trueId})" title="Sæt denne person i bunden af skærmen for at dykke ned i forfædrene">👇 Sæt i bund</button>`;

                card.innerHTML = `
                    <div class="id-badge" title="Sandt ID i Sheets: ${trueId}">${displayId}</div>
                    ${avatarHTML}
                    <div class="card-info">
                        <div class="name">${person.navn.text}</div>
                        <div class="dates">${dateString}</div>
                    </div>
                    ${focusBtnHTML}
                `;
                card.onclick = () => aabenModal(trueId, displayId, false);
                wrapper.appendChild(card);
            } else {
                const addBtn = document.createElement('button');
                addBtn.className = 'add-parent-btn';
                addBtn.innerHTML = `+ Tilføj ${displayId % 2 === 0 ? 'Far' : 'Mor'} (Nr. ${displayId})`;
                addBtn.onclick = () => aabenModal(trueId, displayId, true);
                wrapper.appendChild(addBtn);
                return wrapper; 
            }

            if (currentGen < MAX_GEN) {
                const parentsContainer = document.createElement('div');
                parentsContainer.className = 'parents-container';
                
                const leftBranch = document.createElement('div');
                leftBranch.className = 'parent-branch left-branch';
                leftBranch.appendChild(SkabGren(trueId * 2, currentGen + 1));
                
                const rightBranch = document.createElement('div');
                rightBranch.className = 'parent-branch right-branch';
                rightBranch.appendChild(SkabGren(trueId * 2 + 1, currentGen + 1));

                parentsContainer.appendChild(leftBranch);
                parentsContainer.appendChild(rightBranch);
                wrapper.appendChild(parentsContainer);
            }
            return wrapper;
        }

        let currentEditingTrueId = null;
        const modal = document.getElementById('modal-overlay');

        function aabenModal(trueId, displayId, isNew = false) {
            currentEditingTrueId = trueId;
            document.getElementById('display-vid').innerText = displayId;
            document.getElementById('display-tid').innerText = `(Sandt ID i Sheets: ${trueId})`;
            
            const p = stamtraeData[trueId] || { ft: {} }; 

            formFields.forEach(f => {
                const data = p[f.id] || {text: "", link: ""};
                document.getElementById(`val-${f.id}`).value = data.text;
                if(!f.textOnly) document.getElementById(`link-${f.id}`).value = data.link;
            });
            censusYears.forEach(aar => {
                const data = p.ft[aar] || {text: "", link: ""};
                document.getElementById(`ft-val-${aar}`).value = data.text;
                document.getElementById(`ft-link-${aar}`).value = data.link;
            });

            document.getElementById('view-name').innerText = p.navn?.text || (isNew ? 'Ny Profil' : 'Navnløs');
            let avatarSrc = p.billede?.text ? `<img src="${p.billede.text}">` : `👤`;
            document.getElementById('view-avatar').innerHTML = avatarSrc;
            
            let dateString = "";
            if (p.foedt?.text || p.doed?.text) { dateString = `${p.foedt?.text || '?'} - ${p.doed?.text || '?'}`; }
            document.getElementById('view-dates').innerText = dateString;

            let listHTML = "";
            formFields.forEach(f => {
                if (f.id === 'navn' || f.id === 'billede') return; 
                const data = p[f.id];
                if (data && (data.text || data.link)) {
                    let val = data.text || '';
                    let linkHtml = data.link ? `<a href="${data.link}" target="_blank">🔗 Kilde</a>` : '';
                    listHTML += `<div class="data-row"><div class="data-label">${f.label}</div><div class="data-value"><span>${val}</span> ${linkHtml}</div></div>`;
                }
            });
            
            censusYears.forEach(aar => {
                const data = p.ft[aar];
                if (data && (data.text || data.link)) {
                    let val = data.text || '';
                    let linkHtml = data.link ? `<a href="${data.link}" target="_blank">🔗 Kilde</a>` : '';
                    listHTML += `<div class="data-row"><div class="data-label">FT ${aar}</div><div class="data-value"><span>${val}</span> ${linkHtml}</div></div>`;
                }
            });

            if (listHTML === "") {
                listHTML = `<div style="padding: 15px; color: var(--text-muted); font-style: italic; border: 1px dashed var(--line-color); border-radius: 6px;">Der er endnu ikke registreret nogle oplysninger om denne person.</div>`;
            }
            document.getElementById('view-data-list').innerHTML = listHTML;

            if (isNew || displayId === 1) {
                document.getElementById('set-proband-btn').style.display = 'none';
            } else {
                document.getElementById('set-proband-btn').style.display = 'block';
            }

            if (isNew) { skiftTilEdit(); } else { skiftTilView(); }

            modal.style.display = 'flex';
        }

        function skiftTilEdit() { document.getElementById('view-mode').style.display = 'none'; document.getElementById('edit-mode').style.display = 'block'; }
        function skiftTilView() { document.getElementById('edit-mode').style.display = 'none'; document.getElementById('view-mode').style.display = 'block'; }
        document.getElementById('close-modal').onclick = () => modal.style.display = 'none';

        document.getElementById('save-btn').addEventListener('click', async () => {
            const btn = document.getElementById('save-btn');
            btn.innerText = "Gemmer...";
            
            const payload = { nr: currentEditingTrueId, ft: {} };
            
            formFields.forEach(f => {
                const text = document.getElementById(`val-${f.id}`).value;
                if (f.textOnly) { payload[f.id] = text; } else {
                    const link = document.getElementById(`link-${f.id}`).value;
                    payload[f.id] = (link !== "") ? `${text}||${link}` : text;
                }
            });

            censusYears.forEach(aar => {
                const text = document.getElementById(`ft-val-${aar}`).value;
                const link = document.getElementById(`ft-link-${aar}`).value;
                if(text || link) { payload.ft[aar] = (link !== "") ? `${text}||${link}` : text; }
            });

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                modal.style.display = 'none';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('tree-container').style.display = 'none';
                hentData(); 
            } catch (error) {
                alert("Fejl ved gemning!");
            } finally {
                btn.innerText = "💾 Gem ændringer til Sheets";
            }
        });

        function genererCSV() {
            let exportData = [];
            
            for (let t_id in stamtraeData) {
                let d_id = getDisplayId(parseInt(t_id), sessionProbandTrueId);
                
                if (d_id !== null) {
                    let person = stamtraeData[t_id];
                    let rowCopy = [...person.rawRow]; 
                    rowCopy[0] = d_id; 
                    exportData.push(rowCopy);
                }
            }
            
            exportData.sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
            
            let csvContent = headersRow.join(",") + "\n";
            exportData.forEach(rowArray => {
                let row = rowArray.map(col => {
                    let str = String(col || "");
                    str = str.replace(/"/g, '""'); 
                    if (str.search(/("|,|\n)/g) >= 0) str = `"${str}"`; 
                    return str;
                });
                csvContent += row.join(",") + "\n";
            });
            
            let blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: "text/csv;charset=utf-8;" }); 
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            let pNavn = stamtraeData[sessionProbandTrueId]?.navn.text.split(' ')[0] || "Ukendt";
            link.download = `Slaegtsgren_Fra_${pNavn}.csv`;
            link.click();
        }

        // --- PAN & ZOOM (Inkl. Mobil Touch-events) ---
        const viewport = document.getElementById('viewport');
        const treeContainer = document.getElementById('tree-container');
        let scale = 1, isDragging = false, startX, startY, translateX = 0, translateY = -100;

        function updateTransform() { treeContainer.style.transform = `translate(calc(-50% + ${translateX}px), ${translateY}px) scale(${scale})`; }
        
        // Mus
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.person-card') || e.target.closest('.add-parent-btn') || e.target.closest('#ui-controls')) return;
            isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform();
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mouseleave', () => isDragging = false);

        // Touch (Mobil/Tablet)
        viewport.addEventListener('touchstart', (e) => {
            if (e.target.closest('.person-card') || e.target.closest('.add-parent-btn') || e.target.closest('#ui-controls')) return;
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                startY = e.touches[0].clientY - translateY;
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            if (e.touches.length === 1) {
                translateX = e.touches[0].clientX - startX;
                translateY = e.touches[0].clientY - startY;
                updateTransform();
            }
        }, {passive: false});
        window.addEventListener('touchend', () => isDragging = false);
        
        // Scroll/Hjul (Mus/Touchpad)
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { translateX -= e.deltaX; } else {
                scale += (e.deltaY < 0) ? 0.05 : -0.05; scale = Math.min(Math.max(0.1, scale), 3); 
            }
            updateTransform();
        }, { passive: false });
        
        document.getElementById('zoom-in').onclick = () => { scale = Math.min(scale + 0.15, 3); updateTransform(); };
        document.getElementById('zoom-out').onclick = () => { scale = Math.max(scale - 0.15, 0.1); updateTransform(); };
        
        document.getElementById('btn-reset-proband').onclick = () => { 
            currentViewRootTrueId = sessionProbandTrueId; 
            TegnTrae(); 
        };

        document.getElementById('btn-home').onclick = () => { 
            sessionProbandTrueId = 1; 
            currentViewRootTrueId = 1; 
            TegnTrae(); 
        };

        hentData();
    </script>
</body>
</html>
